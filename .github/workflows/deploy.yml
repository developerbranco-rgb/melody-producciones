# Publica el sitio en GitHub Pages cada vez que se sube un cambio a la rama "main".
# Requisito único: en GitHub > Settings > Pages > "Build and deployment" elegir Source = "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Obtener la configuración de GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas unitarias
        run: npm run test:unit

      - name: Compilar el sitio
        # SITE y BASE_PATH se calculan solos a partir de la URL de GitHub Pages:
        #   https://usuario.github.io/melody-producciones/  ->  SITE=https://usuario.github.io  BASE_PATH=/melody-producciones/
        # Con dominio propio o repositorio "usuario.github.io", BASE_PATH queda en "/".
        run: |
          SITE="${{ steps.pages.outputs.origin }}"
          BASE_PATH="${{ steps.pages.outputs.base_path }}/"
          export SITE BASE_PATH
          echo "SITE=$SITE  BASE_PATH=$BASE_PATH"
          npm run build

      - name: Subir el sitio compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
